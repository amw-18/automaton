[project]
name = "automaton"
version = "0.1.0"
description = "Auto QA Agent - Automated repetitive QA script generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3.79",
    "langchain-google-vertexai>=2.1.2",
    "langgraph>=0.6.10",
    "playwright>=1.55.0",
    "pydantic>=2.12.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
